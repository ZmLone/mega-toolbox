<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - MegaToolbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    
    <!-- Top Navigation -->
    <header class="bg-white shadow-sm px-6 py-4 flex items-center">
        <a href="index.html" class="flex items-center text-gray-600 hover:text-blue-600 transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
    </header>

    <main class="flex-1 p-6 lg:p-10 max-w-5xl mx-auto w-full">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Word Counter</h1>
        <p class="text-gray-500 mb-8">Type or paste your text below for instant real-time analysis.</p>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                <p class="text-sm text-gray-500 uppercase tracking-wide">Words</p>
                <p class="text-3xl font-bold text-blue-600" id="wordCount">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                <p class="text-sm text-gray-500 uppercase tracking-wide">Characters</p>
                <p class="text-3xl font-bold text-green-600" id="charCount">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                <p class="text-sm text-gray-500 uppercase tracking-wide">No Spaces</p>
                <p class="text-3xl font-bold text-purple-600" id="charNoSpaceCount">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                <p class="text-sm text-gray-500 uppercase tracking-wide">Read Time</p>
                <p class="text-3xl font-bold text-orange-500" id="readTime">0m</p>
            </div>
        </div>

        <!-- Text Area -->
        <textarea id="textInput" class="w-full h-80 p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none shadow-sm text-lg" placeholder="Start typing here..."></textarea>
    </main>

    <script>
        const textInput = document.getElementById('textInput');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const charNoSpaceCount = document.getElementById('charNoSpaceCount');
        const readTime = document.getElementById('readTime');

        textInput.addEventListener('input', () => {
            const text = textInput.value;
            
            // Characters
            charCount.textContent = text.length;
            charNoSpaceCount.textContent = text.replace(/\s+/g, '').length;
            
            // Words
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const numWords = words.length;
            wordCount.textContent = numWords;
            
            // Read time (avg 200 words per min)
            const minutes = Math.ceil(numWords / 200);
            readTime.textContent = (numWords === 0) ? '0m' : `${minutes}m`;
        });
    </script>
</body>
</html>
