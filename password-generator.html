<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - MegaToolbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    
    <header class="bg-white shadow-sm px-6 py-4 flex items-center">
        <a href="index.html" class="flex items-center text-gray-600 hover:text-purple-600 transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
    </header>

    <main class="flex-1 p-6 lg:p-10 max-w-3xl mx-auto w-full">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Password Generator</h1>
        <p class="text-gray-500 mb-8">Generate highly secure, locally-rendered passwords.</p>

        <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-200">
            
            <!-- Output Field -->
            <div class="relative mb-8">
                <input type="text" id="passwordOutput" class="w-full text-2xl font-mono p-4 pr-16 bg-gray-50 border border-gray-300 rounded-lg outline-none text-gray-800 tracking-wider" readonly placeholder="Click Generate...">
                <button id="copyBtn" class="absolute right-2 top-1/2 transform -translate-y-1/2 p-2 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-md transition" title="Copy to clipboard">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </button>
            </div>

            <!-- Settings -->
            <div class="space-y-6 mb-8">
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="font-medium text-gray-700">Password Length</label>
                        <span id="lengthVal" class="text-purple-600 font-bold">16</span>
                    </div>
                    <input type="range" id="lengthSlider" min="8" max="64" value="16" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="incUpper" checked class="w-5 h-5 text-purple-600 rounded border-gray-300 focus:ring-purple-500 accent-purple-600">
                        <span class="text-gray-700 font-medium">Uppercase (A-Z)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="incLower" checked class="w-5 h-5 text-purple-600 rounded border-gray-300 focus:ring-purple-500 accent-purple-600">
                        <span class="text-gray-700 font-medium">Lowercase (a-z)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="incNum" checked class="w-5 h-5 text-purple-600 rounded border-gray-300 focus:ring-purple-500 accent-purple-600">
                        <span class="text-gray-700 font-medium">Numbers (0-9)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="incSym" checked class="w-5 h-5 text-purple-600 rounded border-gray-300 focus:ring-purple-500 accent-purple-600">
                        <span class="text-gray-700 font-medium">Symbols (!@#$...)</span>
                    </label>
                </div>
            </div>

            <button id="generateBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-lg shadow-md transition text-lg">
                Generate Password
            </button>
        </div>
    </main>

    <script>
        const slider = document.getElementById('lengthSlider');
        const lengthVal = document.getElementById('lengthVal');
        const output = document.getElementById('passwordOutput');
        const btnGen = document.getElementById('generateBtn');
        const btnCopy = document.getElementById('copyBtn');

        const uppers = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowers = "abcdefghijklmnopqrstuvwxyz";
        const numbers = "0123456789";
        const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

        slider.addEventListener('input', (e) => {
            lengthVal.textContent = e.target.value;
        });

        btnGen.addEventListener('click', () => {
            const length = +slider.value;
            const hasUpper = document.getElementById('incUpper').checked;
            const hasLower = document.getElementById('incLower').checked;
            const hasNum = document.getElementById('incNum').checked;
            const hasSym = document.getElementById('incSym').checked;

            let charPool = "";
            if (hasUpper) charPool += uppers;
            if (hasLower) charPool += lowers;
            if (hasNum) charPool += numbers;
            if (hasSym) charPool += symbols;

            if (charPool === "") {
                output.value = "Select at least one option!";
                return;
            }

            let password = "";
            const randomValues = new Uint32Array(length);
            window.crypto.getRandomValues(randomValues);

            for (let i = 0; i < length; i++) {
                password += charPool[randomValues[i] % charPool.length];
            }

            output.value = password;
        });

        btnCopy.addEventListener('click', () => {
            if(!output.value || output.value === "Select at least one option!") return;
            navigator.clipboard.writeText(output.value);
            
            // Visual feedback
            const originalHTML = btnCopy.innerHTML;
            btnCopy.innerHTML = `<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            setTimeout(() => { btnCopy.innerHTML = originalHTML; }, 1500);
        });

        // Generate one on initial load
        btnGen.click();
    </script>
</body>
</html>
